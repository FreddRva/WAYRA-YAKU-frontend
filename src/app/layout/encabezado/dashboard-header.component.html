<div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-[1000px] min-h-[56px]">
  <div class="absolute inset-0 premium-nav-glass rounded-full"></div>
  
  <div class="relative w-full h-full flex items-center justify-between px-6 py-2 z-10 text-[#f5f5f5]">
    <!-- Izquierda: Botón Menú + Título -->
    <div class="flex items-center gap-4 shrink-0">
      <h1 class="font-sans font-medium text-[10px] sm:text-xs tracking-wide text-white/90 truncate flex items-center gap-3">
        <img src="Escudo.png" alt="Logo UNSCH" class="w-10 h-10 object-contain drop-shadow-md" />
        MONITOREO CONTINUO WAYRA YAKU-UNIVERSIDAD NACIONAL SAN CRISTOBAL DE HUAMANGA
      </h1>
    </div>

    <div class="flex items-center gap-3 shrink-0">
      <app-sampling-menu
        [intervaloMs]="intervaloMs"
        (intervaloChange)="intervaloCambiado.emit($event)"
      ></app-sampling-menu>

      <!-- Ping / Fluidez -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 border border-white/10" title="Tiempo de fluidez">
        <mat-icon class="!text-[16px] !w-[16px] !h-[16px]" [ngClass]="conectado ? 'text-amber-400' : 'text-gray-500'">bolt</mat-icon>
        <span class="text-[11px] font-mono font-bold" [ngClass]="conectado ? 'text-white' : 'text-gray-500'">{{ conectado ? intervaloMs + 'ms' : '---' }}</span>
      </div>

      <app-settings-menu [conectado]="conectado" (exportar)="exportar.emit()" (exportarPDF)="exportarPDF.emit()"></app-settings-menu>

      <div class="relative flex items-center" title="Centro de Notificaciones">
        <button
          class="w-10 h-10 flex items-center justify-center rounded-lg bg-transparent hover:bg-white/10 transition-all outline-none"
          [ngClass]="aiDiagnostic?.is_anomaly ? 'text-red-400 animate-pulse' : 'text-white/70 hover:text-white'"
        >
          <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">notifications</mat-icon>
        </button>
        <span *ngIf="aiDiagnostic?.is_anomaly"
          class="absolute top-0 right-0 flex items-center justify-center min-w-[14px] h-[14px] bg-red-500 text-white font-mono text-[9px] font-bold rounded-full border border-[#0a0a0a]"
        >
          !
        </span>
      </div>
    </div>
  </div>
</div>
