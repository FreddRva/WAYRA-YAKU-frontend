<div
  class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center justify-between px-6 py-2 min-h-[56px] w-[90%] max-w-[1000px] premium-nav-glass rounded-full text-[#f5f5f5]"
>
  <!-- Izquierda: Botón Menú + Título -->
  <div class="flex items-center gap-4 shrink-0">
    <h1 class="font-sans font-medium text-[10px] sm:text-xs tracking-wide text-white/90 truncate flex items-center gap-3">
      <img src="Escudo.png" alt="Logo UNSCH" class="w-10 h-10 object-contain drop-shadow-md" />
      MONITOREO CONTINUO WAYRA YAKU-UNIVERSIDAD NACIONAL SAN CRISTOBAL DE HUAMANGA
    </h1>
  </div>



  <div class="flex items-center gap-3 shrink-0">
    <app-sampling-menu
      [intervaloMs]="intervaloMs"
      (intervaloChange)="intervaloCambiado.emit($event)"
    ></app-sampling-menu>




    <app-settings-menu [conectado]="conectado" (exportar)="exportar.emit()"></app-settings-menu>

    <div class="relative flex items-center">
      <button
        class="w-10 h-10 flex items-center justify-center rounded-lg bg-transparent hover:bg-white/10 text-white/70 hover:text-white transition-all outline-none"
      >
        <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">notifications</mat-icon>
      </button>
      <span
        class="absolute top-0 right-0 flex items-center justify-center min-w-[14px] h-[14px] bg-[#f5f5f5] text-[#0a0a0a] font-mono text-[9px] font-bold rounded-full border border-[#000000]"
      >
        3
      </span>
    </div>
  </div>
</div>
