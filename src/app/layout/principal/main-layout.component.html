<div class="min-h-screen flex flex-col relative bg-transparent">
  <app-dashboard-header
    [conectado]="telemetry.conectado()"
    [intervaloMs]="telemetry.intervaloMs()"
    [ipEsp1]="telemetry.ipEsp1()"
    [ipEsp2]="telemetry.ipEsp2()"
    [ipEsp3]="telemetry.ipEsp3()"
    [apiUrl]="telemetry.apiUrl()"
    [aiDiagnostic]="telemetry.aiDiagnostic()"
    (intervaloCambiado)="cambiarIntervalo($event)"
    (ipGuardada)="guardarIp($event)"
    (apiSubmit)="guardarApi($event)"
    (exportar)="exportarCSV()"
    (exportarPDF)="exportarPDF()"
  >
  </app-dashboard-header>

  <main
    class="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6 relative z-10"
  >
    <div class="h-[48px] w-full shrink-0"></div>

    <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
      <div class="xl:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6">
        <app-filtration-phase
          class="w-full"
          [title]="'Fase 01: Pre-Filtración'"
          [phaseNumber]="1"
          [conectado]="telemetry.conectado()"
          [sensores]="telemetry.sensoresFase1()"
          (onAbrirEstadisticas)="abrirEstadisticas($event)"
        >
        </app-filtration-phase>

        <app-filtration-phase
          class="w-full"
          [title]="'Fase 02: Filtrado Principal'"
          [phaseNumber]="2"
          [conectado]="telemetry.conectado()"
          [sensores]="telemetry.sensoresFase2()"
          (onAbrirEstadisticas)="abrirEstadisticas($event)"
        >
        </app-filtration-phase>

        <app-filtration-phase
          class="w-full"
          [title]="'Fase 03: Post-Filtración'"
          [phaseNumber]="3"
          [conectado]="telemetry.conectado()"
          [sensores]="telemetry.sensoresFase3()"
          (onAbrirEstadisticas)="abrirEstadisticas($event)"
        >
        </app-filtration-phase>
      </div>

      <!-- SIDEBAR COLUMN (Span 1 on XL) -->
      <aside class="xl:col-span-1 flex flex-col gap-6">
        <div class="eng-panel p-0 flex flex-col h-full overflow-hidden">
          <div class="eng-panel-header px-5 pt-5 mb-0 border-b border-white/10">
            <div class="flex items-center gap-3">
              <mat-icon class="text-white/70 text-[20px]">map</mat-icon>
              <span class="text-[16px] font-sans font-bold text-white/90 tracking-widest uppercase">Plano de Planta</span>
            </div>
            <div
              class="flex items-center gap-2 text-[10px] font-mono tracking-widest uppercase px-3 py-1 rounded-full border bg-emerald-500/10 border-emerald-500/30 text-emerald-400"
            >
              <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)] animate-pulse"></div>
              <span>EN VIVO</span>
            </div>
          </div>
          <div class="flex-1 w-full relative">
            <app-mapa-nodos class="absolute inset-0 w-full h-full"></app-mapa-nodos>
          </div>
        </div>
      </aside>
    </div>

    <div class="w-full eng-panel p-0">
      <div class="eng-panel-header px-5 pt-5 mb-0 border-b border-white/10">
        <div class="flex items-center gap-3">
          <div class="w-1.5 h-6 rounded-full bg-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.6)]"></div>
          <span class="text-[16px] font-sans font-bold text-white/90 tracking-widest uppercase">Registro de Telemetría</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] font-mono tracking-widest uppercase px-3 py-1 rounded-full border bg-white/5 border-white/10 text-white/70">
          <span class="w-2 h-2 rounded-full bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.8)] animate-pulse"></span>
          <span>{{ telemetry.totalMuestras() }} Registros</span>
        </div>
      </div>
      <div class="p-5 overflow-x-auto">
        <app-telemetry-table
          [logs]="telemetry.logsRecientes()"
          [totalMuestras]="telemetry.totalMuestras()"
        ></app-telemetry-table>
      </div>
    </div>
  </main>
</div>
