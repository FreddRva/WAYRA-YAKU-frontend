<div class="min-h-screen flex flex-col relative bg-transparent">
  <app-dashboard-header
    [conectado]="telemetry.conectado()"
    [intervaloMs]="telemetry.intervaloMs()"
    [ipEsp1]="telemetry.ipEsp1()"
    [ipEsp2]="telemetry.ipEsp2()"
    [ipEsp3]="telemetry.ipEsp3()"
    [apiUrl]="telemetry.apiUrl()"
    (intervaloCambiado)="cambiarIntervalo($event)"
    (ipGuardada)="guardarIp($event)"
    (apiSubmit)="guardarApi($event)"
    (exportar)="exportarCSV()"
  >
  </app-dashboard-header>

  <main
    class="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6 relative z-10"
  >
    <div class="h-[48px] w-full shrink-0"></div>

    <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
      <div class="xl:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6">
        <app-filtration-phase
          class="w-full"
          [title]="'Fase 01: Pre-Filtración'"
          [phaseNumber]="1"
          [conectado]="telemetry.conectado()"
          [sensores]="telemetry.sensoresFase1()"
          (onAbrirEstadisticas)="abrirEstadisticas($event)"
        >
        </app-filtration-phase>

        <app-filtration-phase
          class="w-full"
          [title]="'Fase 02: Filtrado Principal'"
          [phaseNumber]="2"
          [conectado]="false"
          [sensores]="telemetry.sensoresFase2()"
          (onAbrirEstadisticas)="abrirEstadisticas($event)"
        >
        </app-filtration-phase>

        <app-filtration-phase
          class="w-full"
          [title]="'Fase 03: Post-Filtración'"
          [phaseNumber]="3"
          [conectado]="false"
          [sensores]="telemetry.sensoresFase3()"
          (onAbrirEstadisticas)="abrirEstadisticas($event)"
        >
        </app-filtration-phase>
      </div>

      <!-- SIDEBAR COLUMN (Span 1 on XL) -->
      <aside class="xl:col-span-1 flex flex-col gap-6">
        <div class="eng-panel p-0 flex flex-col h-full overflow-hidden">
          <div class="eng-panel-header px-5 pt-5 mb-0 border-b border-[#262626]">
            <div class="flex items-center gap-2">
              <mat-icon class="text-[#a3a3a3] text-[18px]">map</mat-icon>
              <span class="text-sm font-medium text-[#f5f5f5]">Plano de Planta</span>
            </div>
            <div
              class="flex items-center gap-1.5 px-2 py-1 bg-[#171717] rounded-full border border-[#262626]"
            >
              <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
              <span class="text-[10px] font-mono text-[#a3a3a3]">EN VIVO</span>
            </div>
          </div>
          <div class="flex-1 w-full relative">
            <app-mapa-nodos class="absolute inset-0 w-full h-full"></app-mapa-nodos>
          </div>
        </div>
      </aside>
    </div>

    <div class="w-full eng-panel p-0">
      <div class="eng-panel-header px-5 pt-5 mb-0 border-b border-[#262626]">
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full bg-[#3b82f6]"></div>
          <span class="font-medium text-sm text-[#f5f5f5]">Registro de Telemetría</span>
        </div>
        <div class="flex items-center gap-2 bg-[#171717] px-3 py-1 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-[#3b82f6] animate-pulse"></span>
          <span class="text-xs font-mono text-[#a3a3a3]"
            >{{ telemetry.totalMuestras() }} Registros</span
          >
        </div>
      </div>
      <div class="p-5 overflow-x-auto">
        <app-telemetry-table
          [logs]="telemetry.logsRecientes()"
          [totalMuestras]="telemetry.totalMuestras()"
        ></app-telemetry-table>
      </div>
    </div>
  </main>
</div>
