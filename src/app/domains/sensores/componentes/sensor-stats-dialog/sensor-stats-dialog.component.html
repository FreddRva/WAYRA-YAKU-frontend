<div
  class="bg-[#030303] text-slate-50 flex flex-col w-full h-full rounded-2xl overflow-hidden border border-white/5 shadow-[0_0_60px_rgba(0,0,0,0.9)] relative"
  [style.--card-accent]="accentColor"
>
  <!-- Ambient Glow -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 opacity-10 blur-[80px] pointer-events-none" style="background-color: var(--card-accent)"></div>

  <div
    class="flex justify-between items-center p-6 border-b border-white/5 relative z-10"
  >
    <div class="flex items-center gap-5">
      <div
        class="w-14 h-14 rounded-2xl flex items-center justify-center text-white relative"
        style="background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0)); border: 1px solid rgba(255,255,255,0.05)"
      >
        <div class="absolute inset-0 rounded-2xl opacity-20 blur-md" style="background-color: var(--card-accent)"></div>
        <mat-icon class="relative z-10" style="color: var(--card-accent);">{{ sensor.icono }}</mat-icon>
      </div>
      <div class="flex flex-col">
        <h2 class="m-0 font-brand font-extrabold text-2xl tracking-tight text-white/90">{{ sensor.nombre }}</h2>
        <div class="flex items-center gap-3 mt-1.5">
          <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-widest border border-current" style="color: var(--card-accent); background-color: transparent">ESTADO: {{ sensor.estado | uppercase }}</span>
          
          <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-widest border border-white/10 bg-white/5 text-white/50">
            INSTALACIÓN: HOY
          </span>

          <span
            class="flex items-center gap-2 font-mono text-xs font-semibold"
            style="color: var(--card-accent)"
          >
            <span
              class="w-2 h-2 rounded-full animate-pulse"
              style="background-color: var(--card-accent); box-shadow: 0 0 8px var(--card-accent)"
            ></span>
            Transmisión en Vivo
          </span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button
        mat-icon-button
        class="text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
        (click)="cerrar()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="flex-1 p-6 flex flex-col gap-6 overflow-hidden relative z-10">
    <div class="flex gap-6 h-full">
      <div class="flex-1 flex flex-col overflow-hidden min-w-0">
        <app-sensor-kpis
          [valor]="sensor.valor"
          [unidad]="sensor.unidad"
          [max]="max"
          [min]="min"
          [avg]="avg"
        >
        </app-sensor-kpis>

        <div class="h-[400px] flex mt-4">
          <app-grafico-sensor
            [sensor]="sensor"
            [logsSignal]="data.logsSignal"
            [aiSignal]="data.aiSignal"
            class="flex-1"
          >
          </app-grafico-sensor>
        </div>
      </div>

      @if (aiData) {
        <app-sensor-ai-panel
          class="w-[320px] shrink-0 flex flex-col"
          [aiData]="aiData"
        >
        </app-sensor-ai-panel>
      }
    </div>
  </div>
</div>
