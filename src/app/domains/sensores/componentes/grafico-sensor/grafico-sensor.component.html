<div class="relative flex flex-col flex-1 bg-black/40 backdrop-blur-[30px] border border-white/5 rounded-3xl p-5 min-h-[350px] shadow-[0_15px_40px_-10px_rgba(0,0,0,0.8),inset_0_1px_1px_rgba(255,255,255,0.1)]">
  
  <!-- Tool Bar -->
  <div class="absolute top-6 left-6 z-10 flex items-center gap-1.5 bg-white/5 backdrop-blur-2xl border border-white/10 rounded-2xl p-1.5 shadow-[0_10px_30px_rgba(0,0,0,0.7),inset_0_1px_1px_rgba(255,255,255,0.15)]" (click)="$event.stopPropagation()">
    
    <button (click)="togglePause($event)" class="w-8 h-8 flex items-center justify-center rounded-lg transition-all" [ngClass]="isPaused ? 'bg-amber-500/20 text-amber-500 border border-amber-500/50' : 'bg-white/5 text-slate-400 hover:bg-white/10 hover:text-white'">
      <svg *ngIf="!isPaused" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      <svg *ngIf="isPaused" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    </button>
    
    <div class="w-px h-6 bg-white/10 mx-1"></div>
    
    <button (click)="zoomIn($event)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/5 text-slate-400 hover:bg-white/10 hover:text-white transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></button>
    <button (click)="zoomOut($event)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/5 text-slate-400 hover:bg-white/10 hover:text-white transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></button>
    <button (click)="restoreZoom($event)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/5 text-slate-400 hover:bg-white/10 hover:text-white transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button>
    
    <div class="w-px h-6 bg-white/10 mx-1"></div>
    
    <div class="flex items-center gap-1 bg-black/40 rounded-lg p-1">
      <button class="text-[10px] font-bold font-mono px-2.5 py-1 rounded transition-colors" [class]="timeframe === '10s' ? 'bg-white/20 text-white' : 'text-slate-500 hover:text-white'" (click)="setTimeframe('10s')">10s</button>
      <button class="text-[10px] font-bold font-mono px-2.5 py-1 rounded transition-colors" [class]="timeframe === '30s' ? 'bg-white/20 text-white' : 'text-slate-500 hover:text-white'" (click)="setTimeframe('30s')">30s</button>
      <button class="text-[10px] font-bold font-mono px-2.5 py-1 rounded transition-colors" [class]="timeframe === '1m' ? 'bg-white/20 text-white' : 'text-slate-500 hover:text-white'" (click)="setTimeframe('1m')">1m</button>
      <button class="text-[10px] font-bold font-mono px-2.5 py-1 rounded transition-colors shadow-sm" [class]="timeframe === 'ALL' ? 'bg-white text-black' : 'text-slate-500 hover:text-white'" (click)="setTimeframe('ALL')">ALL</button>
    </div>

    <div class="w-px h-6 bg-white/10 mx-1"></div>
    
    <button (click)="downloadChart($event)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/5 text-slate-400 hover:bg-white/10 hover:text-white transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>
    
    <div class="w-px h-6 bg-white/10 mx-1"></div>
    
    <button (click)="toggleAdvancedTools($event)" class="flex items-center gap-2 text-[10px] font-bold px-3 py-1.5 rounded-lg transition-all border" [class]="showAdvancedTools ? 'bg-purple-600/20 text-purple-400 border-purple-500/50 shadow-[0_0_15px_rgba(168,85,247,0.3)]' : 'bg-white/5 text-slate-400 border-transparent hover:bg-white/10 hover:text-white'">
      <svg *ngIf="showAdvancedTools" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <svg *ngIf="!showAdvancedTools" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      IA CORE
    </button>
  </div>
  <div echarts [options]="chartOptions" (chartInit)="onChartInit($event)" class="echarts-instance"></div>
</div>
