<div class="relative w-full aspect-video rounded-xl overflow-hidden bg-[#000000] border border-[#262626] group">
  <!-- Status Badge Overlay -->
  <div class="absolute top-3 right-3 z-20 flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] font-bold tracking-wider uppercase backdrop-blur-md"
       [ngClass]="streamActual() ? 'bg-[#22c55e]/10 text-[#4ade80] border border-[#22c55e]/20' : 'bg-[#000000]/50 text-[#737373] border border-[#262626]'">
    <span class="w-1.5 h-1.5 rounded-full" 
          [ngClass]="streamActual() ? 'bg-[#22c55e] animate-pulse' : 'bg-[#525252]'"></span>
    {{ streamActual() ? 'En Vivo' : 'Offline' }}
  </div>

  @if (streamActual()) {
    <img [src]="streamActual()" alt="Stream en vivo" class="w-full h-full object-cover">
  } @else {
    <div class="absolute inset-0 flex flex-col items-center justify-center text-[#525252] gap-3">
      <mat-icon class="!w-12 !h-12 !text-[48px] opacity-30">videocam_off</mat-icon>
      <span class="text-[11px] font-medium tracking-widest uppercase text-[#737373]">Cámara Desconectada</span>
    </div>
  }

  <!-- Controls Overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-[#000000]/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center pb-4 gap-4">
    <button class="w-10 h-10 rounded-full bg-[#171717] border border-[#262626] text-[#f5f5f5] flex items-center justify-center hover:bg-[#262626] transition-colors" (click)="recargarStream()" matTooltip="Recargar">
      <mat-icon class="!w-5 !h-5 !text-[20px]">refresh</mat-icon>
    </button>
    <button class="w-10 h-10 rounded-full bg-[#171717] border border-[#262626] text-[#f5f5f5] flex items-center justify-center hover:bg-[#262626] transition-colors" matTooltip="Pantalla Completa">
      <mat-icon class="!w-5 !h-5 !text-[20px]">fullscreen</mat-icon>
    </button>
  </div>
</div>
